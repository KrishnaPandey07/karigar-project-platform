version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: karigar-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: karigar
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: karigar-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/karigar?schema=public
      JWT_ACCESS_SECRET: karigar_super_secret_jwt_access_token_production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: karigar_super_secret_jwt_refresh_token_production
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: karigar_cookie_secret_key_production
      CORS_ORIGIN: http://localhost:80
      FRONTEND_URL: http://localhost:80
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: karigar-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  pgdata:
